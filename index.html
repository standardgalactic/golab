<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoLab — Audio Overview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 3rem 1.25rem; background: #101114; color: #e8e8e8;
         font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 760px; margin: auto; }
  h1 { font-size: 1.6rem; font-weight: 500; }
  canvas { display: block; width: 100%; height: 180px; margin: 2rem 0 1rem; }
  audio { width: 100%; }
  #subtitle { min-height: 3em; text-align: center; margin: 1.5rem 0;
              font-size: 1.1rem; }
  footer { margin-top: 3rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
  a { color: #b9c9f4; }
</style>
</head>
<body>
<main>
<h1>How Go Architecture Enforces System Truth</h1>
<canvas id="visualizer" aria-label="Audio frequency visualization"></canvas>
<audio id="audio" controls preload="metadata" crossorigin="anonymous">
  <source src="How_Go_Architecture_Enforces_System_Truth.mp3" type="audio/mpeg">
  <track kind="captions" src="How_Go_Architecture_Enforces_System_Truth.vtt"
         srclang="en" label="English" default>
</audio>
<p id="subtitle" aria-live="off"></p>
<footer>
  <a href="go-textbook.pdf">Read the essay (PDF)</a>
  <a href="https://github.com/standardgalactic/golab">Source</a>
</footer>
</main>
<script>
const audio = document.querySelector("#audio");
const canvas = document.querySelector("#visualizer");
const ctx = canvas.getContext("2d");
const subtitle = document.querySelector("#subtitle");
let analyser, data;

function draw() {
  requestAnimationFrame(draw);
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, w, h);
  if (!analyser) return;
  analyser.getByteFrequencyData(data);
  const bars = 64, step = Math.max(1, Math.floor(data.length / bars));
  const gap = 3 * devicePixelRatio, bw = w / bars;
  ctx.fillStyle = "#9caedb";
  for (let i = 0; i < bars; i++) {
    const height = (data[i * step] / 255) * h;
    ctx.fillRect(i * bw + gap / 2, (h - height) / 2,
                 Math.max(1, bw - gap), height);
  }
}
draw();

audio.addEventListener("play", () => {
  if (!analyser) {
    const context = new (window.AudioContext || window.webkitAudioContext)();
    const source = context.createMediaElementSource(audio);
    analyser = context.createAnalyser();
    analyser.fftSize = 256;
    data = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    analyser.connect(context.destination);
    audio._context = context;
  }
  audio._context.resume();
});

function updateCaption() {
  const tracks = audio.textTracks;
  if (!tracks.length) return;
  const track = tracks[0];
  if (track.mode === "disabled") track.mode = "hidden";
  subtitle.textContent = Array.from(track.activeCues || [])
    .map(cue => cue.text.replace(/<[^>]*>/g, "")).join(" ");
}
audio.addEventListener("loadedmetadata", updateCaption);
audio.addEventListener("timeupdate", updateCaption);
audio.addEventListener("seeked", updateCaption);
audio.addEventListener("play", updateCaption);
audio.querySelector("track").addEventListener("load", () => {
  const track = audio.textTracks[0];
  track.mode = "hidden";
  track.addEventListener("cuechange", updateCaption);
  updateCaption();
});
</script>
</body>
</html>
